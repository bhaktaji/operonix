name: CI

# Verification only: no cloud credentials, no deployment, no billable resources.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (Java 21, embedded PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Integration tests start an embedded PostgreSQL 16 instance and run the real Flyway
      # migrations, so no database service container is required.
      - name: mvn verify
        working-directory: backend
        run: mvn -B --no-transfer-progress verify

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore

  frontend:
    name: Frontend type check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Production build
        working-directory: frontend
        run: npm run build

  docker:
    name: Container image builds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only: confirms the multi-stage image (SPA bundle baked into the Spring Boot jar)
      # compiles. Nothing is pushed and no registry credentials are used.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: operonix:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The jar's SPA contents are asserted during the Docker build itself (see Dockerfile), so
      # here we only confirm the runtime contract: the jar exists and the process is not root.
      - name: Verify runtime image
        run: |
          docker run --rm --entrypoint sh operonix:ci -c 'test -f /app/app.jar'
          uid=$(docker run --rm --entrypoint id operonix:ci -u)
          test "$uid" != "0"
          echo "runtime uid: $uid (non-root)"