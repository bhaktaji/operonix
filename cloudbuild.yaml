# Cloud Build pipeline for Operonix.
#
# Default use is a build-and-push only (safe: it creates no serving resources):
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_REGION=asia-south1,_AR_REPO=operonix,_IMAGE=operonix
#
# Set _DEPLOY=true to also roll out Cloud Run (used by the GitHub Actions workflow and by
# deploy/gcp/deploy.ps1, which call this with the same substitutions):
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_REGION=asia-south1,_AR_REPO=operonix,_IMAGE=operonix,_DEPLOY=true,_ENV=staging
#
# Prerequisite (once per project): the Cloud Build service account needs Artifact Registry Writer,
# Cloud Run Developer, Service Account User and (for _DEPLOY) Secret Manager Secret Accessor.
# See deploy/gcp/README.md.
substitutions:
  # asia-south1 is the initial default, never a hardcoded assumption: override with _REGION.
  _REGION: asia-south1
  _AR_REPO: operonix
  _IMAGE: operonix
  # staging | production — selects the Cloud Run service name and the runtime env.
  _ENV: staging
  # Build-only by default so an accidental submit cannot publish anything.
  _DEPLOY: "false"

steps:
  # 1. Build the single image that serves the SPA and the API (SPA bundle is baked into the jar).
  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=Dockerfile
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE}:${SHORT_SHA}
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE}:latest
      - .

  # 2. Push both tags to Artifact Registry.
  - id: push-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE}

  # 3. Migrate the database with the same image, in migrate-only mode, before serving the revision.
  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ "${_DEPLOY}" != "true" ]; then
          echo "migrate: skipped (_DEPLOY=${_DEPLOY})"
          exit 0
        fi
        echo "migrate: updating job operonix-migrate-${_ENV}"
        gcloud run jobs update "operonix-migrate-${_ENV}" \
          --region="${_REGION}" \
          --image="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE}:${SHORT_SHA}" \
          --quiet
        gcloud run jobs execute "operonix-migrate-${_ENV}" \
          --region="${_REGION}" \
          --wait \
          --quiet
        echo "migrate: done"

  # 4. Deploy the revision. Secrets are injected from Secret Manager, never baked into the image.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ "${_DEPLOY}" != "true" ]; then
          echo "deploy: skipped (_DEPLOY=${_DEPLOY})"
          exit 0
        fi
        gcloud run deploy "operonix-api-${_ENV}" \
          --region="${_REGION}" \
          --image="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE}:${SHORT_SHA}" \
          --quiet
        echo "deploy: done — smoke test with: deploy/gcp/deploy.sh --env ${_ENV} --smoke-only"

# Keep only the tag Cloud Run is running; ':latest' is retained for rollbacks and local pulls.
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE}:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE}:latest

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
